<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="富良野の氷点下の朝、画面をぐるぐるなぞって濡れタオルを振り回し、凍るまでの速さを競うゲーム。">
<meta name="theme-color" content="#0c1a2e">
<style>[hidden]{display:none!important}html{color-scheme:dark}</style>
<title>凍結タオル選手権</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout concept: 夜明け前の富良野を切り取った1画面ゲーム。上に記録、真ん中に雪原のステージ、結果は下から出る。
   Palette: night / deep / ice / dawn / ember。ember(コートの朱)だけが暖色の差し色。
   Type: Big Shoulders Display(数字と見出し) + Zen Kaku Gothic New(日本語本文)。 */
:root {
  --night: #0c1a2e;
  --deep: #142846;
  --ice: #cdeeff;
  --dawn: #f0a184;
  --ember: #ff6b3d;
  --text: #e8f3fb;
  --muted: #8ea8c2;
  --panel: rgba(12, 26, 46, 0.82);
  --line: rgba(180, 220, 250, 0.2);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  width: 100%;
  max-width: 760px;
  height: 100%;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
}
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 12px; }
.brand { flex: 1; min-width: 0; }
h1 {
  margin: 0;
  font: 900 26px/1 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
.env {
  display: flex; flex-direction: column; align-items: flex-end;
  font-size: 11px; line-height: 1.35; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.env b { color: var(--ice); font-weight: 700; }
.ghostbtn {
  font: 700 13px/1 var(--font-body);
  color: var(--text);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0 14px;
  min-height: 38px;
  cursor: pointer;
}
.ghostbtn:hover { background: rgba(255, 255, 255, 0.07); }
.primary {
  font: 900 15px/1 var(--font-body);
  background: var(--ember);
  color: #1a0b05;
  border: 0;
  border-radius: 999px;
  padding: 0 20px;
  min-height: 44px;
  cursor: pointer;
}
.primary:hover { filter: brightness(1.08); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat {
  min-width: 0;
  padding: 7px 12px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
}
.lab { display: block; font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }
.stat b {
  font: 800 32px/1.05 var(--font-display);
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.stat small { margin-left: 4px; font-size: 11px; color: var(--muted); }
.stat.live b { color: var(--ice); }

.meter { display: flex; align-items: center; gap: 10px; }
.meter .lab { flex: none; }
.bar {
  position: relative; flex: 1; height: 12px; min-width: 0;
  border-radius: 999px; overflow: hidden;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
}
.bar i {
  position: absolute; inset: 0 auto 0 0; width: 0;
  background: linear-gradient(90deg, #3d7fd0, #8fd6ff 70%, #ffffff);
  border-radius: inherit;
}
.bar::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(8, 20, 38, 0.55) calc(10% - 1px) 10%);
}
#pctV {
  flex: none; min-width: 3.4ch; text-align: right;
  font: 800 20px/1 var(--font-display); font-variant-numeric: tabular-nums;
}

.stage {
  position: relative; flex: 1; min-height: 260px;
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--line);
  background: var(--night);
}
#cv {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.hint {
  position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; padding-inline: 16px;
  text-align: center; font-weight: 700; font-size: 13px; letter-spacing: 0.06em;
  color: #ffffff; text-shadow: 0 1px 8px rgba(5, 12, 25, 0.85);
  pointer-events: none; transition: opacity 0.35s;
}
.result {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  max-width: 420px; margin-inline: auto; padding: 16px;
  border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.rank { margin: 0; color: var(--dawn); font-weight: 900; font-size: 13px; letter-spacing: 0.1em; }
.big { margin: 2px 0 10px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.big b { font: 900 56px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); }
.big em {
  font-style: normal; font-size: 11px; font-weight: 900;
  background: var(--ember); color: #1a0b05; padding: 2px 9px; border-radius: 999px;
}
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
.facts dt { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
.facts dd { margin: 0; font: 800 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .primary { flex: 1; }
.share {
  margin-top: 10px; width: 100%; padding: 8px 10px; font: 500 12px var(--font-body);
  color: var(--text); background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line); border-radius: 8px;
}
.tools { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; gap: 6px; }
.toolbtn {
  min-height: 34px; padding: 0 12px; font-size: 12px;
  background: rgba(12, 26, 46, 0.62);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.sharing { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
.sharing .lab { flex: none; margin-right: 2px; }
.sharelink {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 38px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06);
  color: var(--text); font: 700 13px/1 var(--font-body); text-decoration: none;
}
.sharelink:hover { background: rgba(255, 255, 255, 0.14); }
@media (max-width: 420px) {
  h1 { font-size: 22px; }
  .stat b { font-size: 28px; }
  .big b { font-size: 48px; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Frozen Towel</h1>
      <p>凍結タオル選手権 · 富良野</p>
    </div>
    <div class="env" aria-label="環境">
      <span>気温 <b>−24℃</b></span>
      <span>タオル <b id="towelT">+6℃</b></span>
    </div>
  </header>

  <section class="stats" aria-label="記録">
    <div class="stat"><span class="lab">タイム</span><b id="timeV">0.00</b><small>秒</small></div>
    <div class="stat"><span class="lab">ベスト</span><b id="bestV">—</b><small>秒</small></div>
    <div class="stat live"><span class="lab">回転</span><b id="rpsV">0.0</b><small>回/秒</small></div>
  </section>

  <div class="meter">
    <span class="lab">凍結</span>
    <div class="bar" role="progressbar" aria-label="凍結度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="barFill"></i></div>
    <b id="pctV">0%</b>
  </div>

  <main class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="夜明け前の雪原で濡れタオルを振り回す人。画面を円を描くようになぞると回る。"></canvas>
    <div class="tools">
      <button id="resetBtn" class="ghostbtn toolbtn" type="button">リセット</button>
    </div>
    <p class="hint" id="hint">画面をぐるぐるなぞって、濡れタオルを振り回そう</p>
    <section class="result" id="result" hidden aria-live="polite">
      <p class="rank" id="rankV"></p>
      <p class="big"><b id="rTime">0.00</b><span>秒で凍結</span><em id="newBest" hidden>ベスト更新</em></p>
      <dl class="facts">
        <div><dt>最高回転</dt><dd id="rMax"></dd></div>
        <div><dt>平均回転</dt><dd id="rAvg"></dd></div>
        <div><dt>ベスト</dt><dd id="rBest"></dd></div>
      </dl>
      <div class="sharing">
        <span class="lab">SNSに投稿</span>
        <a id="shX" class="sharelink" href="#" target="_blank" rel="noopener noreferrer">X</a>
        <a id="shLine" class="sharelink" href="#" target="_blank" rel="noopener noreferrer">LINE</a>
        <a id="shTh" class="sharelink" href="#" target="_blank" rel="noopener noreferrer">Threads</a>
      </div>
      <div class="actions">
        <button id="againBtn" class="primary" type="button">もう一度</button>
        <button id="copyBtn" class="ghostbtn" type="button">結果をコピー</button>
      </div>
      <input id="shareText" class="share" type="text" readonly hidden aria-label="結果の文章">
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(a, b, t) {
    var A = hex(a), B = hex(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')';
  }
  function setText(el, s) { if (el._v !== s) { el.textContent = s; el._v = s; } }

  /* ---------- state ---------- */
  var W = 0, H = 0, DPR = 1, S = 0, PX = 0, PY = 0, L = 0, RH = 0, HX = 0, HY = 0;
  var theta = Math.PI / 2, omegaT = 0;
  var down = false, pid = null, samples = [];
  var prog = 0, time = 0, revs = 0, maxRps = 0, curRps = 0;
  var started = false, finished = false, finishAt = 0, resultShown = false, flash = 0;
  var best = null;
  try { var bv = parseFloat(localStorage.getItem('frozen-towel-best')); if (isFinite(bv) && bv > 0) best = bv; } catch (e) {}
  var bgc = null;

  var N = 16;
  var nx = new Float32Array(N + 1), ny = new Float32Array(N + 1);
  var frostR = rng(7), frostA = [], frostL = [];
  for (var fi = 0; fi <= N; fi++) {
    frostA.push([frostR() - 0.5, frostR() - 0.5]);
    frostL.push([0.4 + frostR() * 0.9, 0.4 + frostR() * 0.9]);
  }
  var starR = rng(21), stars = [];
  for (var si = 0; si < 46; si++) stars.push({ x: starR(), y: starR() * 0.34, r: 0.6 + starR() * 1.0, ph: starR() * TAU });
  var flakeR = rng(55), flakes = [];
  for (var li = 0; li < 60; li++) flakes.push({ x: flakeR(), y: flakeR(), r: 0.8 + flakeR() * 1.4, v: 12 + flakeR() * 22, ph: flakeR() * TAU });
  var parts = [], carry = 0;

  /* ---------- layout ---------- */
  function layout() {
    var r = stage.getBoundingClientRect();
    W = Math.max(200, Math.floor(r.width));
    H = Math.max(240, Math.floor(r.height));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    S = Math.min(W, H * 0.8);
    PX = W / 2; PY = H * 0.40; L = S * 0.30; RH = S * 0.05;
    buildBackdrop();
  }

  function buildBackdrop() {
    bgc = document.createElement('canvas');
    bgc.width = cv.width; bgc.height = cv.height;
    var b = bgc.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    var farY = function (x) {
      return H * (0.585 - 0.03 * Math.sin(x * 6.3 + 0.4) - 0.018 * Math.sin(x * 14.1 + 2.1) - 0.012 * Math.sin(x * 29 + 1)
        - 0.075 * Math.exp(-Math.pow((x - 0.7) / 0.13, 2)) - 0.04 * Math.exp(-Math.pow((x - 0.3) / 0.1, 2)));
    };
    var nearY = function (x) {
      return H * (0.655 - 0.022 * Math.sin(x * 9 + 1.3) - 0.012 * Math.sin(x * 21 + 0.2)
        - 0.035 * Math.exp(-Math.pow((x - 0.12) / 0.14, 2)) - 0.02 * Math.exp(-Math.pow((x - 0.85) / 0.12, 2)));
    };
    var groundY = function (x) { return H * (0.69 + 0.008 * Math.sin(x * 5 + 0.5)); };
    function layer(fn, stops, bottom, rim) {
      var top = H, x;
      for (x = 0; x <= 1; x += 0.02) top = Math.min(top, fn(x));
      var g = b.createLinearGradient(0, top, 0, bottom);
      stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
      b.fillStyle = g; b.beginPath(); b.moveTo(0, bottom);
      for (x = 0; x <= W; x += 4) b.lineTo(x, fn(x / W));
      b.lineTo(W, bottom); b.closePath(); b.fill();
      b.strokeStyle = rim; b.lineWidth = 1.6; b.beginPath();
      for (x = 0; x <= W; x += 4) { if (x === 0) b.moveTo(x, fn(0)); else b.lineTo(x, fn(x / W)); }
      b.stroke();
    }
    layer(farY, [[0, '#f3c9c4'], [0.45, '#a190b4'], [1, '#4a6593']], H * 0.7, 'rgba(255,222,205,0.7)');
    layer(nearY, [[0, '#8da0c6'], [0.5, '#3b5688'], [1, '#1d3052']], H * 0.74, 'rgba(255,214,196,0.45)');
    var tr = rng(99);
    b.fillStyle = '#12213b';
    for (var i = 0; i < 24; i++) {
      var tx = tr() * W, ty = nearY(tx / W) + 3 + tr() * 10, th = S * 0.035 * (0.6 + tr() * 0.9);
      b.beginPath(); b.moveTo(tx, ty - th); b.lineTo(tx - th * 0.3, ty); b.lineTo(tx + th * 0.3, ty); b.closePath(); b.fill();
    }
    var gg = b.createLinearGradient(0, H * 0.67, 0, H);
    gg.addColorStop(0, '#b9c9e2'); gg.addColorStop(0.25, '#6f8bb6'); gg.addColorStop(1, '#25406b');
    b.fillStyle = gg; b.beginPath(); b.moveTo(0, H);
    for (var gx = 0; gx <= W; gx += 4) b.lineTo(gx, groundY(gx / W));
    b.lineTo(W, H); b.closePath(); b.fill();
    var rr = rng(5);
    b.fillStyle = 'rgba(255,255,255,0.07)';
    for (var k = 0; k < 18; k++) {
      b.beginPath();
      b.ellipse(rr() * W, H * (0.74 + rr() * 0.26), S * (0.1 + rr() * 0.2), S * (0.012 + rr() * 0.02), 0, 0, TAU);
      b.fill();
    }
  }

  /* ---------- input ---------- */
  function addSample(x, y, t) { samples.push({ t: t, x: x, y: y }); }
  cv.addEventListener('pointerdown', function (e) {
    if (finished) return;
    down = true; pid = e.pointerId; samples.length = 0;
    try { cv.setPointerCapture(pid); } catch (_) {}
    addSample(e.clientX, e.clientY, performance.now());
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!down || e.pointerId !== pid) return;
    var t0 = performance.now();
    var list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (list && list.length) {
      for (var i = 0; i < list.length; i++) addSample(list[i].clientX, list[i].clientY, t0 - (e.timeStamp - list[i].timeStamp));
    } else {
      addSample(e.clientX, e.clientY, t0);
    }
  });
  function endPointer(e) { if (e.pointerId === pid) { down = false; pid = null; } }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);

  /* 直近450msの軌跡の重心まわりに、指が何ラジアン進んだかを測る */
  function measure(now) {
    while (samples.length && now - samples[0].t > 450) samples.shift();
    var n = samples.length;
    if (n < 4) return 0;
    var cx = 0, cy = 0, i;
    for (i = 0; i < n; i++) { cx += samples[i].x; cy += samples[i].y; }
    cx /= n; cy /= n;
    var rad = 0;
    for (i = 0; i < n; i++) rad += Math.hypot(samples[i].x - cx, samples[i].y - cy);
    rad /= n;
    if (rad < 14) return 0;
    var prev = Math.atan2(samples[0].y - cy, samples[0].x - cx), total = 0;
    for (i = 1; i < n; i++) {
      var a = Math.atan2(samples[i].y - cy, samples[i].x - cx), d = a - prev;
      while (d > Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      total += d; prev = a;
    }
    var dt = (samples[n - 1].t - samples[0].t) / 1000;
    if (dt < 0.08) return 0;
    return clamp(total / dt, -60, 60);
  }

  /* ---------- game logic ---------- */
  function rankOf(t) {
    if (t <= 2.5) return 'ダイヤモンドダスト級';
    if (t <= 4) return 'しばれの達人';
    if (t <= 7) return '富良野の朝';
    if (t <= 12) return 'まだ少し濡れてる';
    return 'ぬるい朝';
  }
  /* 投稿文に付けるリンク。空ならこのページ自身のアドレスを使う。固定したいときは公開URLを入れる。 */
  var SHARE_URL = '';
  function pageUrl() {
    if (SHARE_URL) return SHARE_URL;
    try { if (/^https?:$/.test(location.protocol)) return location.origin + location.pathname; } catch (e) {}
    return '';
  }
  function shareString() {
    var u = pageUrl();
    return '凍結タオル選手権 富良野：' + time.toFixed(2) + '秒で凍結！(最高' + maxRps.toFixed(1) + '回転/秒) ランク「' + rankOf(time) + '」 #凍結タオル選手権 #富良野' + (u ? ' ' + u : '');
  }

  function updateShareLinks() {
    var q = encodeURIComponent(shareString());
    $('shX').href = 'https://x.com/intent/post?text=' + q;
    $('shLine').href = 'https://line.me/R/msg/text/?' + q;
    $('shTh').href = 'https://www.threads.net/intent/post?text=' + q;
  }

  var isBest = false;
  function finish() {
    finished = true; flash = 1; down = false; samples.length = 0;
    finishAt = performance.now();
    isBest = (best === null || time < best);
    if (isBest) { best = time; try { localStorage.setItem('frozen-towel-best', String(best)); } catch (e) {} }
    var count = reduceMotion ? 20 : 90;
    for (var i = 0; i < count; i++) {
      var a = Math.random() * TAU, v = S * (0.2 + Math.random() * 0.9);
      parts.push({ x: HX + Math.cos(a) * L * 0.5, y: HY + Math.sin(a) * L * 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        g: 30, life: 0.9 + Math.random() * 0.9, max: 1.8, ice: true, r: S * (0.006 + Math.random() * 0.01), ph: Math.random() * TAU });
    }
  }

  function showResult() {
    resultShown = true;
    setText($('rankV'), rankOf(time));
    setText($('rTime'), time.toFixed(2));
    setText($('rMax'), maxRps.toFixed(1) + ' 回/秒');
    setText($('rAvg'), (time > 0 ? revs / time : 0).toFixed(1) + ' 回/秒');
    setText($('rBest'), best === null ? '—' : best.toFixed(2) + ' 秒');
    $('newBest').hidden = !isBest;
    $('shareText').hidden = true;
    $('copyBtn').textContent = '結果をコピー';
    updateShareLinks();
    $('result').hidden = false;
    $('hint').style.opacity = '0';
  }

  function reset() {
    theta = Math.PI / 2; omegaT = 0; down = false; pid = null; samples.length = 0;
    prog = 0; time = 0; revs = 0; maxRps = 0; curRps = 0;
    started = false; finished = false; resultShown = false; flash = 0; isBest = false;
    parts.length = 0;
    $('result').hidden = true;
    var h = $('hint'); h.style.opacity = '1';
    setText(h, '画面をぐるぐるなぞって、濡れタオルを振り回そう');
  }

  $('resetBtn').addEventListener('click', reset);
  $('againBtn').addEventListener('click', reset);
  $('copyBtn').addEventListener('click', function () {
    var txt = shareString(), btn = $('copyBtn');
    function fallback() { var i = $('shareText'); i.value = txt; i.hidden = false; i.focus(); i.select(); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        btn.textContent = 'コピーしました';
        setTimeout(function () { btn.textContent = '結果をコピー'; }, 1800);
      }).catch(fallback);
    } else { fallback(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') { if (document.activeElement && document.activeElement.tagName === 'INPUT') return; reset(); }
  });

  function step(dt, ts) {
    var now = performance.now();
    if (!finished) {
      if (down) { omegaT += (measure(now) - omegaT) * (1 - Math.exp(-dt * 9)); }
      else { omegaT *= Math.exp(-dt * 1.4); }
      if (Math.abs(omegaT) < 0.05) omegaT = 0;
    } else {
      omegaT *= Math.exp(-dt * 6);
      var d = -1.05 - theta;
      d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
      theta += d * (1 - Math.exp(-dt * 3));
    }
    theta += omegaT * dt;
    var rps = Math.abs(omegaT) / TAU;
    curRps = rps;

    if (!finished) {
      if (!started && rps > 0.5) started = true;
      if (started) {
        time += dt; revs += rps * dt;
        if (rps > maxRps) maxRps = rps;
        if (rps < 0.45) prog -= 0.04 * dt;
        else prog += 0.075 * Math.pow(rps, 1.35) * dt;
        prog = clamp(prog, 0, 1);
        if (prog >= 1) finish();
      }
    }
    if (finished && !resultShown && now - finishAt > 900) showResult();

    computeTowel(ts);
    emit(dt);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); }
    }
    for (var j = 0; j < flakes.length; j++) {
      var f = flakes[j];
      f.y += f.v * dt / H;
      if (f.y > 1) { f.y = -0.02; }
    }
    flash *= Math.exp(-dt * 4);

    /* HUD */
    setText($('timeV'), time.toFixed(2));
    setText($('rpsV'), rps.toFixed(1));
    setText($('bestV'), best === null ? '—' : best.toFixed(2));
    var pct = Math.round(prog * 100);
    setText($('pctV'), pct + '%');
    $('barFill').style.width = (prog * 100).toFixed(1) + '%';
    if ($('bar')._p !== pct) { $('bar').setAttribute('aria-valuenow', String(pct)); $('bar')._p = pct; }
    var tt = Math.round(6 - 30 * prog);
    setText($('towelT'), (tt >= 0 ? '+' : '−') + Math.abs(tt) + '℃');
    if (started && !finished) {
      var h = $('hint');
      if (rps < 1.5) { setText(h, 'もっと速く回して！'); h.style.opacity = '1'; }
      else { h.style.opacity = '0'; }
    } else if (!started && !finished) {
      $('hint').style.opacity = down ? '0.5' : '1';
    }
  }

  /* ---------- towel ---------- */
  function computeTowel(ts) {
    var rps = Math.abs(omegaT) / TAU;
    var sp = clamp(rps / 2.2, 0, 1);
    var stiff = Math.pow(prog, 1.4);
    var lagTip = clamp(omegaT * 0.055, -1.35, 1.35) * (1 - 0.85 * stiff);
    var sag = Math.pow(1 - sp, 1.6) * (1 - stiff);
    HX = PX + RH * Math.cos(theta);
    HY = PY + RH * Math.sin(theta);
    for (var i = 0; i <= N; i++) {
      var u = i / N, d = L * u;
      var phi = theta - lagTip * Math.pow(u, 1.4);
      var x = HX + d * Math.cos(phi), y = HY + d * Math.sin(phi);
      var w = sag * (0.35 + 0.65 * u);
      var hxp = HX + Math.sin(ts * 2 + u * 3) * L * 0.05 * u, hyp = HY + d * 0.96;
      x += (hxp - x) * w; y += (hyp - y) * w;
      var wob = (1 - stiff) * u * (2 + sp * 4) * Math.sin(ts * 13 + u * 7);
      x += -Math.sin(phi) * wob; y += Math.cos(phi) * wob;
      nx[i] = x; ny[i] = y;
    }
  }

  function emit(dt) {
    var rps = Math.abs(omegaT) / TAU;
    var sp = clamp(rps / 3, 0, 1.5);
    if (sp < 0.12 || finished) return;
    carry += 70 * sp * (reduceMotion ? 0.3 : 1) * dt;
    var sgn = omegaT >= 0 ? 1 : -1;
    while (carry >= 1) {
      carry -= 1;
      if (parts.length > 320) parts.shift();
      var i = 5 + Math.floor(Math.random() * (N - 4));
      var al = Math.atan2(ny[i] - HY, nx[i] - HX);
      var v = clamp(rps * S * 0.3, 0, S * 2) * (0.6 + Math.random() * 0.6);
      var ice = Math.random() < prog;
      parts.push({
        x: nx[i], y: ny[i],
        vx: -Math.sin(al) * sgn * v + Math.cos(al) * v * 0.25 + (Math.random() - 0.5) * 30,
        vy: Math.cos(al) * sgn * v + Math.sin(al) * v * 0.25 + (Math.random() - 0.5) * 30,
        g: ice ? 40 : S * 1.1, life: 0.6 + Math.random() * 0.6, max: 1.2, ice: ice,
        r: ice ? S * (0.006 + Math.random() * 0.009) : S * (0.004 + Math.random() * 0.005), ph: Math.random() * TAU
      });
    }
  }

  /* ---------- drawing ---------- */
  function drawSky(ts) {
    var p = prog;
    var g = ctx.createLinearGradient(0, 0, 0, H * 0.68);
    g.addColorStop(0, mix('#0a1530', '#17336b', p));
    g.addColorStop(0.55, mix('#1f3d6b', '#5d5a8f', p));
    g.addColorStop(1, mix('#7c6a86', '#f2a384', p));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], a = (0.85 - 0.75 * p) * (0.6 + 0.4 * Math.sin(ts * 2 + s.ph));
      if (a <= 0.02) continue;
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
    }
    var gl = ctx.createRadialGradient(W * 0.7, H * 0.62, 0, W * 0.7, H * 0.62, W * 0.65);
    gl.addColorStop(0, 'rgba(255,170,120,' + (0.2 + 0.45 * p).toFixed(3) + ')');
    gl.addColorStop(1, 'rgba(255,170,120,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  }

  function drawPerson() {
    var s = S, cx = PX, shY = PY + 0.25 * s;
    var coat = '#d9532b', coatDark = '#a53a1c';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = coatDark; ctx.lineWidth = 0.075 * s;
    ctx.beginPath(); ctx.moveTo(cx - 0.13 * s, shY + 0.02 * s); ctx.lineTo(cx - 0.16 * s, shY + 0.2 * s); ctx.stroke();
    ctx.fillStyle = coat;
    ctx.beginPath();
    ctx.moveTo(cx - 0.15 * s, shY + 0.03 * s);
    ctx.quadraticCurveTo(cx - 0.15 * s, shY - 0.03 * s, cx - 0.07 * s, shY - 0.035 * s);
    ctx.lineTo(cx + 0.07 * s, shY - 0.035 * s);
    ctx.quadraticCurveTo(cx + 0.15 * s, shY - 0.03 * s, cx + 0.15 * s, shY + 0.03 * s);
    ctx.lineTo(cx + 0.17 * s, H + 10); ctx.lineTo(cx - 0.17 * s, H + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = coat; ctx.lineWidth = 0.075 * s;
    ctx.beginPath(); ctx.moveTo(cx + 0.11 * s, shY);
    ctx.quadraticCurveTo(cx + 0.17 * s, shY - 0.13 * s, HX, HY); ctx.stroke();
    var hY = shY - 0.1 * s, hr = 0.058 * s;
    ctx.fillStyle = '#2a2230';
    ctx.beginPath(); ctx.arc(cx, hY, hr, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f1ebe0';
    ctx.beginPath(); ctx.arc(cx, hY - 0.004 * s, hr * 1.06, Math.PI * 0.96, Math.PI * 2.04); ctx.closePath(); ctx.fill();
    ctx.fillRect(cx - hr * 1.06, hY - 0.012 * s, hr * 2.12, 0.02 * s);
    ctx.fillStyle = '#ff6b3d';
    ctx.beginPath(); ctx.arc(cx, hY - hr * 1.06 - 0.004 * s, 0.02 * s, 0, TAU); ctx.fill();
  }

  function drawTowel() {
    var wd = S * 0.045;
    var path = function () {
      ctx.beginPath(); ctx.moveTo(nx[0], ny[0]);
      for (var i = 1; i <= N; i++) ctx.lineTo(nx[i], ny[i]);
    };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (prog > 0.5) { ctx.shadowColor = 'rgba(170,230,255,0.9)'; ctx.shadowBlur = 22 * prog * DPR; }
    ctx.strokeStyle = mix('#0f2747', '#8fc4e6', prog); ctx.lineWidth = wd + 3; path(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    ctx.strokeStyle = mix('#4f86c6', '#e4f5ff', prog); ctx.lineWidth = wd; path(); ctx.stroke();
    ctx.strokeStyle = mix('#cfe5ff', '#ffffff', prog); ctx.lineWidth = wd * 0.22; path(); ctx.stroke();
    if (prog > 0.08) {
      ctx.strokeStyle = 'rgba(240,252,255,0.9)'; ctx.lineWidth = 1.2;
      var len = S * 0.045 * Math.pow(prog, 0.8);
      ctx.beginPath();
      for (var i = 1; i <= N; i++) {
        var a = Math.atan2(ny[i] - ny[i - 1], nx[i] - nx[i - 1]);
        for (var k = 0; k < 2; k++) {
          var dir = a + (k ? 1 : -1) * Math.PI / 2 + frostA[i][k] * 1.2;
          var l = len * frostL[i][k];
          ctx.moveTo(nx[i], ny[i]); ctx.lineTo(nx[i] + Math.cos(dir) * l, ny[i] + Math.sin(dir) * l);
        }
      }
      ctx.stroke();
    }
    ctx.fillStyle = '#24324d'; ctx.strokeStyle = '#0c1626'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(HX, HY, 0.03 * S, 0, TAU); ctx.fill(); ctx.stroke();
  }

  function drawParts(ts) {
    var i, p;
    ctx.fillStyle = 'rgba(165,208,255,0.85)';
    for (i = 0; i < parts.length; i++) {
      p = parts[i]; if (p.ice) continue;
      ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.lineWidth = 1.3; ctx.strokeStyle = '#dff6ff';
    for (i = 0; i < parts.length; i++) {
      p = parts[i]; if (!p.ice) continue;
      var tw = 0.55 + 0.45 * Math.sin(ts * 18 + p.ph);
      ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1) * tw;
      var r = p.r * 1.6;
      ctx.beginPath();
      ctx.moveTo(p.x - r, p.y); ctx.lineTo(p.x + r, p.y);
      ctx.moveTo(p.x, p.y - r); ctx.lineTo(p.x, p.y + r);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawGhost(ts) {
    var r = S * 0.2, a = ts * TAU * 1.1;
    ctx.save();
    ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(PX, PY, r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    for (var k = 6; k >= 0; k--) {
      var aa = a - k * 0.14;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.85 - k * 0.12).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(PX + Math.cos(aa) * r, PY + Math.sin(aa) * r, 10 - k * 0.9, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function render(ts) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky(ts);
    if (bgc) ctx.drawImage(bgc, 0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      ctx.beginPath();
      ctx.arc(f.x * W + Math.sin(ts * 0.6 + f.ph) * 10, f.y * H, f.r, 0, TAU); ctx.fill();
    }
    drawPerson();
    drawTowel();
    drawParts(ts);
    if (!started && !down && !finished) drawGhost(ts);
    if (flash > 0.02) { ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.55).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  /* ---------- boot ---------- */
  layout();
  if (window.ResizeObserver) { new ResizeObserver(layout).observe(stage); }
  else { window.addEventListener('resize', layout); }
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    step(dt, now / 1000);
    render(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</html>
